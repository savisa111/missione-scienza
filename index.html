body{

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.game{
    background:white;
    width:90%;
    max-width:700px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:18px;
    font-weight:bold;
}

#question{
    font-size:24px;
    margin-bottom:20px;
    text-align:center;
}

.btn{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    background:#3498db;
    color:white;
    transition:.3s;
}

.btn:hover{
    background:#2980b9;
}

.correct{
    background:#2ecc71 !important;
}

.wrong{
    background:#e74c3c !important;
}

#message{
    margin-top:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

#restart{
    display:none;
    margin-top:20px;
    width:100%;
    padding:15px;
    font-size:18px;
    background:#f39c12;
    color:white;
    border:none;
    border-radius:10px;
}
</style>

let currentQuestion = 0;
let score = 0;
let lives = 3;

const q = document.getElementById("question");
const answersDiv = document.getElementById("answers");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const message = document.getElementById("message");

function loadQuestion(){

if(currentQuestion >= questions.length){
    q.innerHTML="🏆 Hai completato Missione Scienza!";
    answersDiv.innerHTML="";
    message.innerHTML="Punteggio finale: "+score+" XP";
    document.getElementById("restart").style.display="block";
    return;
}

const current = questions[currentQuestion];

levelEl.textContent = current.level;

q.innerHTML=current.question;

answersDiv.innerHTML="";

current.answers.forEach((answer,index)=>{

const btn=document.createElement("button");

btn.classList.add("btn");

btn.innerText=answer;

btn.onclick=()=>checkAnswer(index);

answersDiv.appendChild(btn);

});
}

function checkAnswer(index){

const current=questions[currentQuestion];
const buttons=document.querySelectorAll(".btn");

if(index===current.correct){

buttons[index].classList.add("correct");

score+=10;
scoreEl.textContent=score;

message.innerHTML="✅ Bravo!";
}
else{

buttons[index].classList.add("wrong");

buttons[current.correct].classList.add("correct");

lives--;
livesEl.textContent=lives;

message.innerHTML="❌ Ritenta!";

if(lives<=0){
    gameOver();
    return;
}
}

setTimeout(()=>{
message.innerHTML="";
currentQuestion++;
loadQuestion();
},1200);

}

function gameOver(){

q.innerHTML="💀 Game Over";

answersDiv.innerHTML="";

message.innerHTML="Hai ottenuto "+score+" XP";

document.getElementById("restart").style.display="block";
}

function restartGame(){

currentQuestion=0;
score=0;
lives=3;

scoreEl.textContent=0;
livesEl.textContent=3;
message.innerHTML="";
document.getElementById("restart").style.display="none";

loadQuestion();

}

loadQuestion();
